# One pipeline that carries a change from merge request to production and writes
# every step into an Acta ledger, so afterwards you can check nobody edited the story.
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml

stages: [test, package, record_package, staging, record_staging, production, record_production, monitor, record_monitor, govern]

default:
  image: node:22

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  GCP_REGION: us-central1

.record: &record
  artifacts:
    paths: [.acta-run/]
    when: always
    expire_in: 30 days

test:
  stage: test
  <<: *record
  script:
    - npm ci
    - npx tsc --noEmit
    - npm test
    - npm run attack
    - scripts/ci-step.sh ci-pipeline verify "typecheck, 118+ tests and the attack table passed"
  after_script:
    - '[ "$CI_JOB_STATUS" = "success" ] || scripts/ci-step.sh ci-pipeline verify "tests failed" --failed'


# The package, deploy and smoke jobs run in images without node, so a small
# node job after each one writes its step into the ledger (restored from the
# previous record job's artifact).
.record_job:
  <<: *record
  rules: [{ if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $GCP_PROJECT' }]

package:
  stage: package
  image: docker:27
  services: [docker:27-dind]
  needs: [test]
  rules: [{ if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH' }]
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" .
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"

.deploy:
  image: google/cloud-sdk:slim
  needs: [package]
  rules: [{ if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $GCP_PROJECT' }]
  script:
    - gcloud auth activate-service-account --key-file="$GCP_SA_KEY"
    - sh deploy/cloud-run.sh "$SERVICE" "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"

deploy_staging:
  extends: .deploy
  stage: staging
  variables: { SERVICE: acta-checker-staging }
  environment: { name: staging, url: "$STAGING_URL" }

smoke_staging:
  stage: staging
  needs: [deploy_staging]
  rules: [{ if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $GCP_PROJECT' }]
  script:
    - sh deploy/smoke.sh "$STAGING_URL"

deploy_production:
  extends: .deploy
  stage: production
  needs: [smoke_staging, package]
  variables: { SERVICE: acta-checker }
  environment: { name: production, url: "$PRODUCTION_URL" }

smoke_production:
  stage: monitor
  needs: [deploy_production]
  rules: [{ if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $GCP_PROJECT' }]
  script:
    - sh deploy/smoke.sh "$PRODUCTION_URL"

record_package:
  extends: .record_job
  stage: record_package
  needs: [package, { job: test, artifacts: true }]
  script: [scripts/ci-step.sh ci-pipeline package "built and pushed the container image $CI_COMMIT_SHORT_SHA"]

record_staging:
  extends: .record_job
  stage: record_staging
  needs: [smoke_staging, { job: record_package, artifacts: true }]
  script: [scripts/ci-step.sh ci-pipeline release "deployed to staging and the smoke check passed"]

record_production:
  extends: .record_job
  stage: record_production
  needs: [deploy_production, { job: record_staging, artifacts: true }]
  script: [scripts/ci-step.sh ci-pipeline configure "production service settings applied from deploy/cloud-run.sh"]

record_monitor:
  extends: .record_job
  stage: record_monitor
  needs: [smoke_production, { job: record_production, artifacts: true }]
  script: [scripts/ci-step.sh ci-pipeline monitor "production smoke check passed"]

# Govern: close the ledger and fail the pipeline if it does not check out.
govern:
  stage: govern
  <<: *record
  needs:
    - job: test
      artifacts: true
    - job: record_monitor
      artifacts: true
      optional: true
  rules: [{ if: '$CI_COMMIT_BRANCH' }]
  script:
    - scripts/ci-step.sh ci-pipeline govern "pipeline finished; closing the record"
    - cp "$ACTA_RECORDER_KEY" .acta-run/recorder.key 2>/dev/null || true
    - node bin/acta.mjs step .acta-run --close || true
    - node bin/acta.mjs show .acta-run
    - node bin/acta.mjs verify .acta-run --json > acta-verdict.json
    - rm -f .acta-run/recorder.key
  artifacts:
    paths: [.acta-run/, acta-verdict.json]
    when: always
